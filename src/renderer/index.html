<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
		/>
		<title>casioapp</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<!--
			The case is a wrapper element rather than the SVG itself, because the letterbox maths belongs
			to the wrapper: the SVG is drawn in the case's own coordinate system at whatever size the
			wrapper gives it. See `styles.css` for the aspect ratio and the drag rules.
		-->
		<div id="root"><div class="case" id="case"></div></div>
		<script type="module" src="./index.js"></script>
	</body>
</html>
